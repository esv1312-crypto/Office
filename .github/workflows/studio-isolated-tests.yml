name: Universal AI Studio isolated tests

on:
  push:
    branches:
      - studio-v1-foundation
    paths:
      - "studio/**"
      - ".github/workflows/studio-isolated-tests.yml"
  pull_request:
    paths:
      - "studio/**"
      - ".github/workflows/studio-isolated-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-isolated-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-tests:
    name: Syntax and isolated unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STUDIO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/studio_test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install runtime dependencies for PostgreSQL integration tests
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check Studio JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find studio -type f -name '*.js' -print0)

      - name: Run Studio unit tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(find studio -type f -name '*.test.js' -print0)
          if (("${#tests[@]}" == 0)); then
            echo "No Studio unit tests found"
            exit 1
          fi
          node --test "${tests[@]}"
