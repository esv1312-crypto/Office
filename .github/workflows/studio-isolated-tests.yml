name: Universal AI Studio isolated tests

on:
  push:
    branches:
      - studio-v1-foundation
    paths:
      - "studio/**"
      - ".github/workflows/studio-isolated-tests.yml"
  pull_request:
    paths:
      - "studio/**"
      - ".github/workflows/studio-isolated-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-isolated-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-tests:
    name: Syntax and isolated unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Studio JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find studio -type f -name '*.js' -print0)

      - name: Run Studio unit tests
        run: node --test studio
