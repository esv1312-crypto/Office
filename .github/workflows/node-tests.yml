name: AI-OFFICE unit tests

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ai-office-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js test/*.js scripts/*.js; do
            node --check "$file"
          done
      - name: Run dependency-free unit tests
        run: npm test

  live-runtime-smoke:
    name: Authorized live runtime smoke tests
    if: github.ref == 'refs/heads/main'
    needs: node-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OFFICE_BASE_URL: https://ai-office-runtime-8pir.onrender.com
      OFFICE_AUDIT_TOKEN: ${{ secrets.OFFICE_AUDIT_TOKEN }}
    steps:
      - name: Exercise real provider fallback, recovery, evidence pipeline, and office audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          base = os.environ["OFFICE_BASE_URL"].rstrip("/")
          token = os.environ.get("OFFICE_AUDIT_TOKEN", "").strip()
          if not token:
              raise SystemExit("FAIL: GitHub Actions secret OFFICE_AUDIT_TOKEN is missing")
          headers = {"x-ai-office-audit-token": token, "Accept": "application/json"}
          def get(path, timeout=480):
              req = urllib.request.Request(base + path, headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      body = resp.read().decode("utf-8", "replace")
                      return resp.status, json.loads(body) if body else {}
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  try: data = json.loads(body)
                  except Exception: data = {"body": body[:1500]}
                  return e.code, data
          def run_check(label, path):
              status, data = get(path)
              print(json.dumps({"check":label,"http_status":status,"result":data}, ensure_ascii=False)[:12000])
              if status < 200 or status >= 300 or data.get("ok") is not True:
                  raise SystemExit(f"FAIL: {label} returned HTTP {status} or ok != true")
              return data
          def wait_task(label, task_id, max_seconds=420):
              deadline = time.time() + max_seconds
              last = {}
              while time.time() < deadline:
                  status, data = get("/api/tasks/" + task_id, timeout=30)
                  if status == 200 and isinstance(data, dict):
                      last = data.get("task", data)
                      state = str(last.get("status","")).lower()
                      if state in ("completed","complete","succeeded","success"):
                          print(json.dumps({"check":label,"status":state,"task":last},ensure_ascii=False)[:10000])
                          return
                      if state in ("failed","cancelled","canceled","dead"):
                          raise SystemExit("FAIL: " + label + " task ended " + state + ": " + json.dumps(last,ensure_ascii=False)[:3000])
                  elif status not in (200, 404):
                      raise SystemExit(f"FAIL: cannot poll {label} task, HTTP {status}: {data}")
                  time.sleep(8)
              raise SystemExit("FAIL: timeout waiting for " + label + ": " + json.dumps(last,ensure_ascii=False)[:3000])
          run_check("provider_fallback", "/api/smoke/fallback?run=1")
          run_check("root_recovery", "/api/smoke/recovery?run=1")
          evidence = run_check("evidence_pipeline_acceptance", "/api/smoke/evidence?run=1")
          evidence_id = evidence.get("taskId")
          if not evidence_id: raise SystemExit("FAIL: evidence pipeline did not return taskId")
          wait_task("evidence_pipeline_completion", evidence_id)
          audit = run_check("office_audit_acceptance", "/api/office-check?run=1")
          task = audit.get("task") or {}
          audit_id = task.get("id") or audit.get("taskId")
          if not audit_id: raise SystemExit("FAIL: office audit did not return task ID")
          wait_task("office_audit_completion", audit_id, 600)
          print("PASS: all authorized live runtime smoke checks completed")
          PY
