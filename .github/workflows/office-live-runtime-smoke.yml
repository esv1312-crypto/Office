name: AI-OFFICE authorized live runtime audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-runtime-smoke:
    name: Provider fallback, recovery, evidence, and office audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OFFICE_BASE_URL: https://ai-office-runtime-8pir.onrender.com
      OFFICE_AUDIT_TOKEN: ${{ secrets.OFFICE_AUDIT_TOKEN }}
    steps:
      - name: Run authorized read-only live checks
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          base = os.environ["OFFICE_BASE_URL"].rstrip("/")
          token = os.environ.get("OFFICE_AUDIT_TOKEN", "").strip()
          if not token:
              raise SystemExit("FAIL: configure repository Actions secret OFFICE_AUDIT_TOKEN to match Render; secret value is never printed")
          headers = {"x-ai-office-audit-token": token, "Accept": "application/json"}
          failures = []
          outcomes = []

          def get(path, timeout=480):
              req = urllib.request.Request(base + path, headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      body = resp.read().decode("utf-8", "replace")
                      return resp.status, json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  try:
                      data = json.loads(body)
                  except Exception:
                      data = {"body": body[:1000]}
                  return exc.code, data

          def run_check(label, path):
              try:
                  status, data = get(path)
                  ok = 200 <= status < 300 and data.get("ok") is True
                  outcome = {"check": label, "http_status": status, "ok": ok, "result": data}
                  print(json.dumps(outcome, ensure_ascii=False)[:10000], flush=True)
                  outcomes.append({"check": label, "ok": ok})
                  if not ok:
                      failures.append(f"{label}: HTTP {status} or ok != true")
                      return None
                  return data
              except Exception as exc:
                  failures.append(f"{label}: request error: {exc}")
                  outcomes.append({"check": label, "ok": False})
                  print(json.dumps({"check": label, "ok": False, "error": str(exc)}, ensure_ascii=False), flush=True)
                  return None

          def wait_task(label, task_id, max_seconds=600):
              deadline = time.time() + max_seconds
              last = {}
              while time.time() < deadline:
                  try:
                      status, data = get("/api/tasks/" + task_id, timeout=30)
                  except Exception as exc:
                      failures.append(f"{label}: poll error: {exc}")
                      outcomes.append({"check": label, "ok": False})
                      return False
                  if status == 200 and isinstance(data, dict):
                      last = data.get("task", data)
                      state = str(last.get("status", "")).lower()
                      if state in ("completed", "complete", "succeeded", "success"):
                          print(json.dumps({"check": label, "status": state, "ok": True, "task": last}, ensure_ascii=False)[:8000], flush=True)
                          outcomes.append({"check": label, "ok": True})
                          return True
                      if state in ("failed", "cancelled", "canceled", "dead"):
                          detail = json.dumps(last, ensure_ascii=False)[:3500]
                          print(json.dumps({"check": label, "status": state, "ok": False, "task": last}, ensure_ascii=False)[:6000], flush=True)
                          failures.append(f"{label}: task ended {state}: {detail}")
                          outcomes.append({"check": label, "ok": False})
                          return False
                  elif status not in (200, 404):
                      failures.append(f"{label}: poll returned HTTP {status}: {data}")
                      outcomes.append({"check": label, "ok": False})
                      return False
                  time.sleep(8)
              detail = json.dumps(last, ensure_ascii=False)[:2500]
              failures.append(f"{label}: timeout: {detail}")
              outcomes.append({"check": label, "ok": False})
              print(json.dumps({"check": label, "status": "timeout", "ok": False, "last_task": last}, ensure_ascii=False)[:5000], flush=True)
              return False

          fallback = run_check("provider_fallback", "/api/smoke/fallback?run=1")
          recovery = run_check("root_recovery", "/api/smoke/recovery?run=1")

          evidence = run_check("evidence_pipeline_acceptance", "/api/smoke/evidence?run=1")
          evidence_id = evidence.get("taskId") if evidence else None
          if evidence_id:
              wait_task("evidence_pipeline_completion", evidence_id)
          else:
              failures.append("evidence_pipeline_completion: no task ID returned")
              outcomes.append({"check": "evidence_pipeline_completion", "ok": False})

          audit = run_check("office_audit_acceptance", "/api/office-check?run=1")
          audit_task = (audit or {}).get("task") or {}
          audit_id = audit_task.get("id") or (audit or {}).get("taskId")
          if audit_id:
              wait_task("office_audit_completion", audit_id)
          else:
              failures.append("office_audit_completion: no task ID returned")
              outcomes.append({"check": "office_audit_completion", "ok": False})

          print(json.dumps({"summary": outcomes, "failure_count": len(failures), "failures": failures}, ensure_ascii=False)[:12000], flush=True)
          if failures:
              raise SystemExit("FAIL: one or more live checks failed; all independent checks were attempted and details are listed above")
          print("PASS: all authorized live runtime checks completed")
          PY
