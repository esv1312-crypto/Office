name: AI-OFFICE one-time smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - "audit/**"

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Send real task to AI-OFFICE runtime
        env:
          OFFICE_AUDIT_TOKEN: ${{ secrets.OFFICE_AUDIT_TOKEN }}
        run: |
          set -e
          test -n "$OFFICE_AUDIT_TOKEN" || { echo "Missing required GitHub secret OFFICE_AUDIT_TOKEN"; exit 1; }
          echo "Calling runtime..."
          curl -fsS --retry 3 --retry-all-errors --max-time 90 \
            -X POST "https://ai-office-runtime-8pir.onrender.com/api/tasks" \
            -H "content-type: application/json" \
            -H "x-ai-office-audit-token: $OFFICE_AUDIT_TOKEN" \
            -d '{"task":"Проведи проверку самого AI-ОФИСА. Составь короткий план из 3 шагов, выполни доступные проверки runtime и наблюдаемости по имеющимся данным, верни итог и критерии проверки. Не выдумывай выполненные действия."}'
          echo
          echo "Reading runtime state..."
          curl -fsS --retry 3 --retry-all-errors --max-time 30 \
            -H "x-ai-office-audit-token: $OFFICE_AUDIT_TOKEN" \
            "https://ai-office-runtime-8pir.onrender.com/api/state"
          echo
