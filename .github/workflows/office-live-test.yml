name: AI-OFFICE LIVE TEST

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  launch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[office live test]')
    runs-on: ubuntu-latest
    steps:
      - name: Send real root task to AI-OFFICE
        env:
          TASK: >-
            Проведи реальный smoke-test AI-OFFICE после обновления.
            Проверь multi-provider gateway и resource manager.
            Определи доступные легальные бесплатные AI-провайдеры из конфигурации,
            не используй чужие или утёкшие ключи и не выполняй платных запросов.
            Если основной провайдер недоступен из-за квоты/ошибки, используй следующий
            настроенный бесплатный провайдер. Раздели работу между аналитиком,
            программистом и проверяющим. В конце выполни независимую проверку и
            верни PASS или FAIL с доказательствами: provider, fallback, worker results,
            verification и итоговое состояние задачи.
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 120 -X POST \
            https://ai-office-runtime-8pir.onrender.com/api/tasks \
            -H 'Content-Type: application/json' \
            --data "$(python -c 'import json,os; print(json.dumps({"task":os.environ["TASK"],"employeeId":"chief"}))')"

# Live smoke-test trigger: keep this workflow runnable from main commits.

# authorized live smoke test [office live test]
