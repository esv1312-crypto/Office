name: AI-OFFICE LIVE TEST

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  launch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[office live test]')
    runs-on: ubuntu-latest
    steps:
      - name: Send real root task to AI-OFFICE
        env:
          TASK: >-
              FINAL GREEN CHECK: Проведи финальный end-to-end smoke test AI-OFFICE после последних изменений. Работай ТОЛЬКО через легальные бесплатные модели OpenRouter и настроенные бесплатные провайдеры; никаких платных запросов. Используй самые компетентные бесплатные модели по ролям: руководитель/архитектор — Nemotron 3 Ultra или другой сильнейший доступный free reasoning/orchestration; аналитик — Nemotron 3 Super; программист — Laguna S 2.1 или North Mini Code; проверяющий — Gemma 4 31B, а при недоступности автоматически переходи на Qwen 3.8 27B или другой сильный free verifier. Исполнитель — Nemotron 3.5 Lightning для быстрых вспомогательных операций. Проверь сам себя по цепочке: multi-provider gateway, free-only защита, выбор модели по компетенции, round-robin/fallback при отказе модели, распределение ролей, выполнение параллельных подзадач, независимая верификация, recovery/replacement при отказе бойца, resource manager и финальное состояние root task. Не делай опасных или платных действий и не используй чужие/утёкшие ключи. Если обнаружишь проблему — сначала классифицируй её, затем попробуй восстановление/замену и повторную проверку. В конце дай строгий PASS или FAIL и доказательства: что проверено, какие модели реально отработали, какие fallback сработали, были ли ошибки, какие recovery/replacement сработали, и почему итог можно считать PASS/FAIL.
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 120 -X POST \
            https://ai-office-runtime-8pir.onrender.com/api/tasks \
            -H 'Content-Type: application/json' \
            --data "$(python -c 'import json,os; print(json.dumps({"task":os.environ["TASK"],"employeeId":"chief"}))')"

# Live smoke-test trigger: keep this workflow runnable from main commits.

# authorized live smoke test [office live test] FINAL GREEN
