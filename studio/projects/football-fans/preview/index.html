<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fan District — 3D preview</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:Inter,system-ui,Arial}
#view{position:fixed;inset:0}#hud{position:fixed;left:14px;top:14px;max-width:min(340px,calc(100vw - 28px));padding:14px 16px;background:#101820dd;border:1px solid #ffffff24;border-radius:14px;backdrop-filter:blur(10px);z-index:2}
h1{font-size:18px;margin:0 0 5px}p{font-size:12px;line-height:1.4;color:#c7d2dc;margin:0}
#zones{position:fixed;left:14px;bottom:14px;display:flex;gap:7px;flex-wrap:wrap;max-width:calc(100vw - 28px);z-index:2}
button{border:1px solid #ffffff30;background:#172633e8;color:white;border-radius:20px;padding:8px 11px;font-size:11px}
button:active{background:#df7b32}
#hint{position:fixed;right:14px;bottom:14px;background:#101820cc;padding:9px 12px;border-radius:10px;color:#c7d2dc;font-size:11px;z-index:2}
@media(max-width:600px){#hint{bottom:78px;left:14px;right:auto}#hud{padding:11px 13px}h1{font-size:16px}}
</style>
</head>
<body><div id="view"></div>
<div id="hud"><h1>FAN DISTRICT · 3D ПРЕВЬЮ</h1><p>Концептуальная браузерная реконструкция нашей карты по Roblox-генератору. Вращай сцену пальцем или мышью, приближай двумя пальцами / колёсиком.</p></div>
<div id="zones">
<button data-cam="district">Весь район</button><button data-cam="square">Площадь фанатов</button><button data-cam="stadium">Стадион</button><button data-cam="pitch">Мини-поле</button><button data-cam="street">Фан-улица</button>
</div><div id="hint">Потяни, чтобы вращать · щипок/колесо — масштаб</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bb9c7);scene.fog=new THREE.Fog(0x9bb9c7,900,1800);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,3000);camera.position.set(820,680,900);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.querySelector('#view').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=260;controls.maxDistance=1500;
scene.add(new THREE.HemisphereLight(0xffffff,0x52634b,2.0));const sun=new THREE.DirectionalLight(0xfff2d9,2.4);sun.position.set(-350,700,450);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-800;sun.shadow.camera.right=800;sun.shadow.camera.top=800;sun.shadow.camera.bottom=-800;scene.add(sun);
const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const grass=mat('#668d5d'),road=mat('#343b43'),concrete=mat('#aeb4b5'),dark=mat('#252d35'),blue=mat('#3475b4'),orange=mat('#df7b32'),red=mat('#b94143'),green=mat('#32864c'),white=mat('#f0f0e8'),glass=new THREE.MeshStandardMaterial({color:'#8fc1d2',roughness:.25,metalness:.1});
function block(x,y,z,w,h,d,m, parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y+h/2,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function slab(x,z,w,d,m,y=0,h=1){return block(x,y,z,w,h,d,m)}
function label(text,x,y,z,size=20,color='#fff'){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='rgba(24,32,40,.88)';ctx.fillRect(0,0,512,128);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.strokeRect(3,3,506,122);ctx.fillStyle=color;ctx.font='bold 46px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,256,65);const tex=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));s.position.set(x,y,z);s.scale.set(size*2.6,size*.65,1);scene.add(s)}
function building(x,z,w,d,h,color,name){block(x,h/2,z,w,h,d,color);block(x,h+1.5,z,w+4,3,d+4,dark);block(x,h*.58,z-d/2-1,w*.68,h*.28,2,glass);block(x,h*.78,z-d/2-2.2,Math.min(w*.72,54),7,1,blue);label(name,x,h+17,z-d/2-5,17)}
// ground and connected pedestrian routes
slab(0,0,1100,920,grass,-8,8);
slab(-20,105,720,34,road);slab(-330,255,34,300,road);slab(260,145,34,300,road);slab(-20,-285,600,30,road);slab(0,300,540,28,road);
// Arrival plaza
slab(-330,270,190,150,concrete,0,2);label('WELCOME TO FAN DISTRICT',-330,29,195,22);label('ARRIVAL PLAZA',-330,18,320,16);
// central supporters square
slab(0,0,210,190,concrete,0,2);slab(0,58,58,22,dark,2,8);slab(0,-22,42,42,blue,2,1);label("SUPPORTERS' SQUARE",0,24,48,22,'#ffd49b');
for(let i=-2;i<=2;i++)slab(i*34,-72,26,5,dark,2,3);
for(const x of [-82,82]){slab(x,-55,24,24,dark,1,3);block(x,13,-55,4,18,4,orange);const crown=new THREE.Mesh(new THREE.SphereGeometry(11,12,10),green);crown.position.set(x,30,-55);scene.add(crown)}
// shop/cafe and Fan Street storefronts
building(-250,-100,76,58,28,orange,'FAN SHOP');slab(-250,-145,92,28,concrete,.2,1);
building(230,-120,82,62,30,blue,'THE TERRACE CAFE');slab(230,-170,100,38,concrete,.2,1);
for(const x of [190,230,270]){slab(x,-188,12,12,dark,2,2);slab(x-10,-188,5,5,orange,1,3)}
building(-90,220,74,48,24,concrete,'FAN HUB');
building(-190,185,66,48,24,red,'SCARVES & FLAGS');building(5,185,72,50,25,orange,'MATCHDAY DINER');building(190,185,68,48,24,blue,'FAN WORKSHOP');
for(const x of [-190,5,190]){slab(x,150,56,4, x===-190?red:x===5?orange:blue,13,3);slab(x-15,158,18,1,glass,4,12);slab(x+15,158,18,1,glass,4,12)}
label('FAN STREET',0,42,105,20);label('ONE CITY · ONE CROWD',-90,25,176,14,'#ffc16e');
// mini football pitch
slab(-270,-330,190,118,green,0,2);slab(-270,-330,2,112,white,2,.4);const circle=new THREE.Mesh(new THREE.TorusGeometry(17,.8,8,48),white);circle.rotation.x=Math.PI/2;circle.position.set(-270,2.6,-330);scene.add(circle);
for(const z of [-388,-272]){block(-270,10,z,3,18,28,white);block(-283,8,z,3,16,24,white)}
for(const x of [-370,-170])slab(x,-330,4,118,dark,0,12);for(const z of [-395,-265])slab(-270,z,204,4,dark,0,12);
label('MINI PITCH',-270,28,-410,21);const ball=new THREE.Mesh(new THREE.SphereGeometry(3,16,12),white);ball.position.set(-270,6,-330);scene.add(ball);
// stadium forecourt and entry gates
slab(260,270,230,150,concrete,0,2);label('MATCHDAY STADIUM',260,30,195,22,'#ffb2a8');
for(let i=-2;i<=2;i++){const x=260+i*30;block(x,12,215,18,24,5,dark);block(x,26,215,20,4,8,orange)}
// stadium footprint, pitch, seating bowl
slab(270,0,370,280,dark,0,8);slab(270,0,210,126,green,8,2);slab(270,0,2,122,white,10,.3);
for(const z of [-66,66]){block(270,18,z,34,18,3,white);block(270,17,z+(z>0?13:-13),30,16,3,white)}
// stands and coloured seating rows
block(270,4,145,330,42,42,blue);block(270,4,-145,330,42,42,red);block(65,4,0,42,42,220,orange);block(475,4,0,42,42,220,blue);
for(let row=1;row<=10;row++){let y=9+row*2.8;let zn=120-row*4.5,zs=-120+row*4.5;for(let s=0;s<10;s++){let x=122+s*33;slab(x,zn,29,3,s%2?blue:orange,y,2);slab(x,zs,29,3,s%2?red:orange,y,2)}}
for(let row=1;row<=10;row++){let y=9+row*2.8,xw=120+row*4.5,xe=420-row*4.5;for(let s=0;s<6;s++){let z=-96+s*38;slab(xw,z,3,32,s%2?orange:blue,y,2);slab(xe,z,3,32,s%2?blue:red,y,2)}}
slab(270,145,350,48,dark,48,5);slab(270,-145,350,48,dark,48,5);slab(65,0,48,230,dark,48,5);slab(475,0,48,230,dark,48,5);
block(270,58,126,54,30,5,dark);label('HOME 0 : 0 AWAY',270,62,122,15,'#9eff9d');label('THE HOME GROUND',270,68,174,25,'#ffb2a8');
for(const x of [55,485])for(const z of [-155,155]){block(x,41,z,4,82,4,dark);block(x,82,z,18,8,5,white)}
// lamps, banners and little details
for(const z of [70,140])for(const x of [-170,-40,90]){block(x,11,z,2,22,2,dark);block(x,22,z,8,2,4,white)}
for(const x of [-190,-110,-30,50,130]){block(x,9,105,1,18,1,dark);block(x+3,11,105,1,10,7,x%2?orange:blue)}
// pathways and landscaping markers
for(const [x,z] of [[-450,350],[-470,200],[430,350],[480,260],[-420,-200],[80,-260]]){const t=new THREE.Mesh(new THREE.ConeGeometry(9,24,8),green);t.position.set(x,12,z);scene.add(t)}
// small coloured scarf display at shop
for(let i=0;i<5;i++)slab(-275+i*8,-158,5,1,[blue,orange,red,green,white][i],13,14);
const groundGrid=new THREE.GridHelper(1100,22,0x71836d,0x71836d);groundGrid.position.y=.15;groundGrid.material.transparent=true;groundGrid.material.opacity=.12;scene.add(groundGrid);
function setCam(key){const poses={district:[[820,680,900],[0,0,0]],square:[[-80,250,360],[0,0,0]],stadium:[[610,380,490],[270,10,0]],pitch:[[-470,240,-510],[-270,0,-330]],street:[[-430,260,100],[-30,0,130]]};const p=poses[key];camera.position.set(...p[0]);controls.target.set(...p[1]);controls.update()}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setCam(b.dataset.cam)));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
